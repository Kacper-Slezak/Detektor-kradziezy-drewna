services:
  web:
    build: .
    image: expense-tracker-api:1.0
    container_name: fastapi_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: "service_healthy"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  timescaledb:
      image: timescale/timescaledb-ha:pg18
      environment:
        POSTGRES_USER: detektor
        POSTGRES_PASSWORD: secretpassword
        POSTGRES_DB: detektor
      ports:
        - 5432:5432
      volumes:
       - timescaledb:/home/postgres/pgdata/data
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U detektor -d detektor"]
        interval: 10s
        timeout: 5s
        retries: 5
volumes:
  timescaledb:
