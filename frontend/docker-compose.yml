services:
  web:
    build: .
    image: detektor-frontend
    container_name: detektor_frontend
    environment:
      # backend from backend/docker-compose.yml, exposed on port 8000 of the host
      API_TARGET: http://host.docker.internal:8000
      # Docker Desktop on Windows does not forward file change events from bind mounts
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
