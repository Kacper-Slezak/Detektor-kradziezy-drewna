<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#1f5130" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detektor kradzieży drewna</title>
    <script>
      // Dark theme before the app loads, so the page does not flash white (logic: src/lib/theme.ts)
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
